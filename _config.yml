title:            Jiyuan Tan's site
description:      Welcome to my site.
# Your site's domain goes here. Leave localhost server or blank when working locally.
url:              //jiyuan-tan.github.io
#http://localhost:5000
#https://jponttuset.github.io

# Owner/author information
owner:
  name:           Jiyuan Tan
  avatar:         jiyuantan.jpg
  bio:            I am currently a PhD student in Management Science and Engineering at Stanford University.
  email:          JiyuanTan19@gmail.com
  # Social networking links are used in author-bio sidebar. Update and remove as you like.
  google_scholar: nXyv100AAAAJ
  github: Jiyuan-Tan
# Analytics: set google_analytics to your GA id when you want tracking
google_verify:
# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Links to include in top navigation
# For external links add external: true
links:
  - title: Curriculum
    url: /cv/
  - title: Publications
    url: /publications/
# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
Timezone: America/Los_Angeles
future:      true
#pygments:    true
highlighter: rouge
markdown:    kramdown
kramdown:
  extensions: ["strikethrough"]
  
# https://github.com/mojombo/jekyll/wiki/Permalinks
permalink:   /:categories/:title/

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

syntax_highlighter_opts:
  line_numbers:
  line_numbers_start: 1
  tab_width: 4
  bold_every: 10
  css: class

include: [".htaccess"]
exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", "less", "*.sublime-project", "*.sublime-workspace", "test", "spec", "Gruntfile.js", "package.json", "node_modules", "Gemfile", "Gemfile.lock", "LICENSE", "README.md"]
